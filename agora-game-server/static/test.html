<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Three.js Local Test</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="info" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:#888;font-family:monospace;font-size:14px;z-index:10;background:rgba(0,0,0,0.7);padding:8px 16px;border-radius:4px;">
  ⏳ Loading Three.js locally...
</div>

<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

console.log('THREE imported:', typeof THREE);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(2, 2, 4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.prepend(renderer.domElement);

const gl = renderer.getContext();
const info = document.getElementById('info');

if (!gl) {
  info.textContent = '❌ WebGL context failed';
  info.style.color = '#ff4444';
} else {
  info.textContent = '✅ WebGL OK - building scene...';

  // Green box
  const geometry = new THREE.BoxGeometry(1, 1, 1);
  const material = new THREE.MeshStandardMaterial({
    color: 0x44ff88,
    roughness: 0.2,
    metalness: 0.8,
  });
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);

  // Ground plane
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 4),
    new THREE.MeshStandardMaterial({ color: 0x333366, roughness: 0.8, side: THREE.DoubleSide })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.6;
  scene.add(ground);

  // Lights
  scene.add(new THREE.AmbientLight(0x333366, 0.4));
  const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
  dirLight.position.set(3, 5, 2);
  scene.add(dirLight);
  const backLight = new THREE.PointLight(0xff6622, 0.4, 8);
  backLight.position.set(-2, 2, -1);
  scene.add(backLight);

  // Animate
  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.02;
    renderer.render(scene, camera);
  }
  animate();

  info.textContent = '✅ Three.js OK - rotating green cube';
  info.style.color = '#44ff88';
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: #14161d;
    font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .pill {
    width: 388px;
    background: linear-gradient(160deg, #171922 0%, #12141c 100%);
    border: 1px solid #2b2f3d;
    border-radius: 16px;
    box-shadow: inset 0 1px 0 #ffffff10;
    padding: 6px 10px 10px;
    color: #eceef6;
  }
  .drag { height: 20px; display: flex; align-items: center; }
  .title {
    font-size: 10px; font-weight: 600; letter-spacing: .4px;
    color: #6f7484; margin-left: 6px; flex: 1;
  }
  .btn-icon {
    width: 24px; height: 24px; border: 0; border-radius: 8px;
    background: transparent; color: #6f7484; font-size: 12px;
    cursor: pointer; line-height: 24px; text-align: center;
    transition: background .15s, color .15s;
  }
  .btn-icon:hover { background: #ffffff12; color: #c9cdd8; }
  .scope {
    width: 100%; height: 46px; display: block;
    background: #0d0f15; border: 1px solid #23263a;
    border-radius: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .rec {
    width: 38px; height: 38px; border-radius: 50%;
    border: 0; cursor: pointer; position: relative; flex-shrink: 0;
    background: linear-gradient(145deg, #8b5cf6, #ec4899);
    color: #fff; font-size: 14px;
    box-shadow: 0 4px 14px rgba(139, 92, 246, .4);
    transition: transform .15s, box-shadow .15s;
  }
  .rec:hover { transform: scale(1.06); }
  .rec:active { transform: scale(.97); }
  .rec.stop { background: linear-gradient(145deg, #ef4444, #f97316); box-shadow: 0 4px 14px rgba(239,68,68,.4); }
  .rec:disabled { opacity: .55; cursor: wait; }
  .pulse::after {
    content: ""; position: absolute; inset: -4px;
    border-radius: 50%; border: 2px solid #ec489988;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: .9; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  .meta { flex: 1; min-width: 0; }
  .status {
    font-size: 11px; font-weight: 600; letter-spacing: .5px;
    color: #8a8fa0; margin-bottom: 2px;
  }
  .status.rec { color: #ff6b7a; }
  .status.busy { color: #ffb74d; }
  .transcript {
    font-size: 11px; color: #c9cdd8; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
</head>
<body>
  <div class="pill">
    <div class="drag pywebview-drag-region">
      <span class="title">DICTATE · Ctrl+Shift+R</span>
      <button class="btn-icon" id="btnCfg" title="Nastavenia">⚙</button>
      <button class="btn-icon" id="btnExit" title="Zavrieť">✕</button>
    </div>
    <canvas class="scope" id="scope"></canvas>
    <div class="row">
      <button class="rec" id="btnRec">●</button>
      <div class="meta">
        <div class="status" id="status">PRIPRAVENÝ</div>
        <div class="transcript" id="transcript">—</div>
      </div>
    </div>
  </div>
<script>
const scope = document.getElementById("scope");
const ctx = scope.getContext("2d");
const statusEl = document.getElementById("status");
const transEl = document.getElementById("transcript");
const btnRec = document.getElementById("btnRec");
const history = [];
let agcTarget = 1;
let api = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  scope.width = scope.clientWidth * dpr;
  scope.height = scope.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function draw() {
  const w = scope.clientWidth, h = scope.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = "#1c2030";
  ctx.lineWidth = 1;
  for (const gy of [h * 0.33, h * 0.66]) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke();
  }
  // auto-gain: recent peaks fill the full scope height
  let rolling = 0.15;
  for (const v of history) if (v > rolling) rolling = v;
  agcTarget = agcTarget + ((0.92 / rolling) - agcTarget) * 0.06;
  const scale = Math.max(1, Math.min(4, agcTarget));

  const n = history.length;
  if (n > 1) {
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, "#22d3aa");
    grad.addColorStop(1, "#22d3ee");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.shadowColor = "#22d3aa55";
    ctx.shadowBlur = 5;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const x = w - (n - 1 - i) * (w / 240);
      const v = Math.max(0.03, Math.min(1, history[i] * scale));
      const y = h - 3 - v * (h - 8);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    const y = h - 3 - Math.max(0.03, Math.min(1, history[n-1] * scale)) * (h - 8);
    ctx.fillStyle = "#ff5470";
    ctx.beginPath();
    ctx.arc(w - 2, y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

window.addEventListener("pywebviewready", () => {
  api = window.pywebview.api;
  setInterval(tick, 60);
});
async function tick() {
  try {
    const wave = await api.get_wave();
    if (wave && wave.length) history.push(...wave);
    while (history.length > 240) history.shift();
    const st = await api.get_status();
    applyStatus(st);
  } catch (e) { /* bridge not ready */ }
}
function applyStatus(st) {
  statusEl.textContent = st.status;
  statusEl.className = "status" + (st.state === "RECORDING" ? " rec" : st.state === "TRANSCRIBING" || st.state === "INJECTING" ? " busy" : "");
  if (st.state === "RECORDING") {
    btnRec.textContent = "■"; btnRec.classList.add("stop", "pulse");
  } else {
    btnRec.textContent = "●"; btnRec.classList.remove("stop", "pulse");
    btnRec.disabled = (st.state === "TRANSCRIBING" || st.state === "INJECTING");
  }
  if (st.transcript) transEl.textContent = st.transcript;
}
btnRec.addEventListener("click", () => {
  if (api) api.toggle_record();
});
document.getElementById("btnCfg").addEventListener("click", () => {
  if (api) api.open_config();
});
document.getElementById("btnExit").addEventListener("click", () => {
  if (api) api.exit();
});
</script>
</body>
</html>

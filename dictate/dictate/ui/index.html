<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<style>
  /* Dictate overlay.
     Ground is near-black and the accent is a single warm amber, taken from broadcast level
     meters rather than from any dictation app: bars sit grey until the signal is loud, and the
     only red in the window is the tally dot that means the microphone is live. The previous
     version carried three colour families in a window the size of a business card, a purple to
     pink gradient button, a red to orange one while recording, and a teal waveform, each with its
     own coloured glow.
     Body and pill share one background colour so a GPU that bleeds the rounded corner has nothing
     white to show. */
  :root {
    --ground:  #0b0b0c;
    --raise:   #141416;
    --line:    #232326;
    --ink:     #e8e6e1;
    --ink-dim: #7d7b76;
    --amber:   #e0a33c;
    --tally:   #d8434b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: var(--ground);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    display: flex; align-items: stretch;
  }
  .pill {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--ground);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 7px 11px 9px;
    color: var(--ink);
  }

  /* Machine state is set in mono, human words in the sans above. The rule has a reason: it tells
     you at a glance which strings the app chose and which ones you said. */
  .mono {
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase;
  }

  .drag { height: 18px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .mark {
    width: 7px; height: 7px; border-radius: 2px;
    background: var(--ink-dim); flex-shrink: 0;
    transition: background .18s;
  }
  .title { color: var(--ink-dim); flex: 1; }
  .btn-icon {
    width: 20px; height: 20px; border: 0; border-radius: 6px;
    background: transparent; color: var(--ink-dim); font-size: 11px;
    cursor: pointer; line-height: 20px; text-align: center;
    transition: background .15s, color .15s;
  }
  .btn-icon:hover { background: #ffffff10; color: var(--ink); }

  .meter {
    height: 34px; width: 100%; display: block; margin-top: 5px;
    background: var(--raise);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .row { display: flex; align-items: center; gap: 9px; margin-top: 7px; flex-shrink: 0; }
  /* A rounded square, not a circle, so nothing has to be concentric with anything and no ring
     needs room to expand past the window edge. */
  button.rec {
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--raise);
    cursor: pointer; flex-shrink: 0; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, background .15s;
  }
  button.rec:hover { border-color: #3a3a3e; background: #191919; }
  button.rec:disabled { opacity: .45; cursor: wait; }
  .glyph { width: 10px; height: 10px; border-radius: 50%; background: var(--tally); }
  button.rec.stop .glyph { border-radius: 2px; width: 9px; height: 9px; background: var(--ink); }

  .meta { flex: 1 1 auto; min-width: 0; }
  .status { color: var(--ink-dim); }
  .status.is-recording { color: var(--tally); }
  .status.is-busy { color: var(--amber); }
  /* Two lines and then it scrolls, rather than an ellipsis that hides the end of what you said. */
  .transcript {
    font-size: 11px; color: var(--ink); line-height: 1.32; margin-top: 2px;
    max-height: 29px; overflow-y: auto; overflow-x: hidden;
    overflow-wrap: anywhere;
  }
  .transcript::-webkit-scrollbar { width: 3px; }
  .transcript::-webkit-scrollbar-thumb { background: #303034; border-radius: 3px; }
  .transcript.empty { color: var(--ink-dim); }

  /* The tally dot blinks in place. Nothing scales, so nothing is clipped by the window edge. */
  .live .mark { background: var(--tally); animation: tally 1.5s steps(1, end) infinite; }
  @keyframes tally { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .25; } }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="drag pywebview-drag-region">
      <span class="mark" id="mark"></span>
      <span class="title mono">Dictate &middot; Ctrl+Shift+R</span>
      <button class="btn-icon" id="btnCfg" title="Nastavenia">&#9881;</button>
      <button class="btn-icon" id="btnExit" title="Zavrieť">&#10005;</button>
    </div>
    <canvas class="meter" id="meter"></canvas>
    <div class="row">
      <button class="rec" id="btnRec" title="Nahrávať"><span class="glyph"></span></button>
      <div class="meta">
        <div class="status mono" id="status">Pripravený</div>
        <div class="transcript empty" id="transcript">Podrž Ctrl+Shift+R a hovor</div>
      </div>
    </div>
  </div>
<script>
const meter = document.getElementById("meter");
const ctx = meter.getContext("2d");
const statusEl = document.getElementById("status");
const transEl = document.getElementById("transcript");
const btnRec = document.getElementById("btnRec");
const pill = document.getElementById("pill");
const history = [];
let agcTarget = 1;
let api = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = meter.clientWidth, h = meter.clientHeight;
  meter.width = Math.max(1, Math.round(w * dpr));
  meter.height = Math.max(1, Math.round(h * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
new ResizeObserver(resize).observe(meter);
resize();

// A SEGMENTED LEVEL METER, not a waveform. Each column quantises to whole segments, so the
// display reads as an instrument rather than as an audio visualiser, and a column near the top
// warms to amber the way a meter's headroom band does.
const COL_W = 3, COL_GAP = 2, SEG_H = 3, SEG_GAP = 1.6;

function draw() {
  const w = meter.clientWidth, h = meter.clientHeight;
  if (w <= 0 || h <= 0) { requestAnimationFrame(draw); return; }
  ctx.clearRect(0, 0, w, h);

  const pad = 4;
  const inner = h - pad * 2;
  const segs = Math.max(3, Math.floor((inner + SEG_GAP) / (SEG_H + SEG_GAP)));
  const cols = Math.max(1, Math.floor((w - pad * 2 + COL_GAP) / (COL_W + COL_GAP)));

  let rolling = 0.15;
  for (const v of history) if (v > rolling) rolling = v;
  agcTarget = agcTarget + ((0.92 / rolling) - agcTarget) * 0.06;
  const scale = Math.max(1, Math.min(4, agcTarget));

  for (let c = 0; c < cols; c++) {
    const idx = history.length - cols + c;
    const raw = idx >= 0 ? history[idx] : 0;
    const v = Math.max(0, Math.min(1, raw * scale));
    const lit = Math.round(v * segs);
    const x = pad + c * (COL_W + COL_GAP);
    for (let s = 0; s < segs; s++) {
      const y = h - pad - (s + 1) * SEG_H - s * SEG_GAP;
      if (s < lit) {
        ctx.fillStyle = (s / segs) > 0.78 ? "#e0a33c" : "#9a9791";
      } else {
        ctx.fillStyle = "#1e1e21";
      }
      ctx.fillRect(x, y, COL_W, SEG_H);
    }
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

window.addEventListener("pywebviewready", () => {
  api = window.pywebview.api;
  setInterval(tick, 60);
});
async function tick() {
  try {
    const wave = await api.get_wave();
    if (wave && wave.length) history.push(...wave);
    while (history.length > 240) history.shift();
    const st = await api.get_status();
    applyStatus(st);
  } catch (e) { /* bridge not ready */ }
}
function applyStatus(st) {
  statusEl.textContent = st.status;
  const busy = st.state === "TRANSCRIBING" || st.state === "INJECTING";
  statusEl.className = "status mono" + (st.state === "RECORDING" ? " is-recording" : busy ? " is-busy" : "");
  pill.classList.toggle("live", st.state === "RECORDING");
  btnRec.classList.toggle("stop", st.state === "RECORDING");
  btnRec.disabled = busy;
  btnRec.title = st.state === "RECORDING" ? "Zastaviť" : "Nahrávať";
  if (st.transcript) {
    transEl.textContent = st.transcript;
    transEl.classList.remove("empty");
    transEl.scrollTop = transEl.scrollHeight;
  }
}
btnRec.addEventListener("click", () => { if (api) api.toggle_record(); });
document.getElementById("btnCfg").addEventListener("click", () => { if (api) api.open_config(); });
document.getElementById("btnExit").addEventListener("click", () => { if (api) api.exit(); });
</script>
</body>
</html>

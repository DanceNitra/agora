<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<style>
  /* Dictate: a pill and nothing else.
     The hotkey starts and stops the transcription, so the window has one job left, which is to
     show that the microphone is hearing you. Config, reload and exit live in the tray menu.
     The mark is the app's logo. The accent is amber rather than the lime of the product this
     borrows its outline from.
     Body and pill share one background so a GPU that bleeds the rounded corner has nothing pale
     to show. */
  :root {
    --ground: #0a0a0d;
    --line:   #1ab5c2;   /* the accent at rest: clearly cyan, not a muddy teal that
                            reads as grey in a 2 px line on black */
    --accent: #2bf4ff;   /* fluorescent cyan; it has to read from across the desk */
    --accent-dim: #0d5b63;
    --idle:   #3f3f49;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    background: var(--ground);
    overflow: hidden;
    display: flex; align-items: stretch;
  }
  .pill {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: 8px;
    background: var(--ground);
    /* No border here. A border is part of the layout, so a fraction of a pixel of overflow
       pushed the bottom edge out of the viewport: the owner saw a line on the left, top and
       right only, cut off square at the corners. The ring below is painted on a fixed overlay
       instead, which the content cannot move. */
    border: 0;
    border-radius: 0;
    /* The same 8 px on every side, so the mark sits in an even frame. */
    padding: 8px;
    cursor: grab;
  }
  .pill:active { cursor: grabbing; }

  /* While the microphone is open the mark breathes and the window's own edge carries the accent,
     so the pill says "listening" even in a silent room, where every bar would otherwise sit flat.
     The border is the one element visible from across the desk. */

  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  /* No inset glow: it drew a second ring just inside the border, and two rings with slightly
     different corners read as a window inside a window. */
  .ring.live { animation: edge 1.4s ease-in-out infinite; }
  @keyframes edge {
    0%, 100% { box-shadow: inset 0 0 0 2px var(--accent); }
    50%      { box-shadow: inset 0 0 0 2px var(--accent-dim); }
  }
  /* Working, not listening: the ring holds still, dimmer, so the states cannot be confused. */
  .ring.busy { box-shadow: inset 0 0 0 2px var(--accent-dim); }
  /* Transcribing and injecting: the mark holds still and turns red, the meter is frozen. */
  .busy .mark { opacity: 1; filter: hue-rotate(-28deg) saturate(1.5); }
  .meter { flex: 1 1 auto; height: 24px; display: block; min-width: 0; }

  /* The ring. `position: fixed` pins it to the viewport, so no amount of content can push an
     edge out of view, and an inset shadow paints inward from all four sides at once, corners
     included. 2 css px, which is 3 physical at this scaling. */
  .ring {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    box-shadow: inset 0 0 0 2px var(--line);
  }

</head>
<body>
  <div class="ring" id="ring"></div>
  <div class="pill pywebview-drag-region" id="pill">
    <div class="mark"></div>
    <canvas class="meter" id="meter"></canvas>
  </div>
<script>
const meter = document.getElementById("meter");
const ctx = meter.getContext("2d");
const pill = document.getElementById("pill");
const ring = document.getElementById("ring");
const history = [];
let agcTarget = 1;
let api = null;
let state = "IDLE";

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = meter.clientWidth, h = meter.clientHeight;
  meter.width = Math.max(1, Math.round(w * dpr));
  meter.height = Math.max(1, Math.round(h * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
new ResizeObserver(resize).observe(meter);
resize();

// THE METER. Bars grow from a centre line in both directions with rounded caps, so the shape
// reads as a waveform rather than as the single-baseline dot row this borrows its outline from.
// At rest every bar collapses to the centre and the row is a flat dotted line, which is what a
// silent microphone should look like.
const BAR_W = 3, BAR_GAP = 3, MIN_H = 3;

function draw() {
  const w = meter.clientWidth, h = meter.clientHeight;
  if (w <= 0 || h <= 0) { requestAnimationFrame(draw); return; }
  ctx.clearRect(0, 0, w, h);

  const mid = h / 2;
  const bars = Math.max(1, Math.floor((w + BAR_GAP) / (BAR_W + BAR_GAP)));
  const maxH = h - 2;

  let rolling = 0.15;
  for (const v of history) if (v > rolling) rolling = v;
  agcTarget = agcTarget + ((0.92 / rolling) - agcTarget) * 0.06;
  const scale = Math.max(1, Math.min(4, agcTarget));

  for (let b = 0; b < bars; b++) {
    const idx = history.length - bars + b;
    const raw = idx >= 0 ? history[idx] : 0;
    const v = Math.max(0, Math.min(1, raw * scale));
    const barH = Math.max(MIN_H, v * maxH);
    const x = b * (BAR_W + BAR_GAP);
    // The newest bar sits at the right edge and is the one the eye should follow.
    const newest = b === bars - 1;
    ctx.fillStyle = barH <= MIN_H + 0.5 ? "#3f3f49"
                  : newest ? "#ffffff" : "#2bf4ff";
    ctx.beginPath();
    ctx.roundRect(x, mid - barH / 2, BAR_W, barH, BAR_W / 2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

window.addEventListener("pywebviewready", () => {
  api = window.pywebview.api;
  setInterval(tick, 60);
});
async function tick() {
  try {
    const wave = await api.get_wave();
    if (wave && wave.length) history.push(...wave);
    while (history.length > 120) history.shift();
    const st = await api.get_status();
    if (st.state !== state) {
      state = st.state;
      ring.classList.toggle("live", state === "RECORDING");
      ring.classList.toggle("busy", state === "TRANSCRIBING" || state === "INJECTING");
      pill.classList.toggle("live", state === "RECORDING");
      // Nothing is heard while the model runs, so the meter should not pretend otherwise.
      if (state === "TRANSCRIBING" || state === "IDLE") history.length = 0;
    }
  } catch (e) { /* bridge not ready */ }
}
</script>
</body>
</html>

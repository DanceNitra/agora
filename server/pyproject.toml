[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agora"
version = "0.1.0"
description = "Persistent agent playground — browser-based ecosystem for heterogeneous AI agents"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "DanceNitra", email = "dancenitra@users.noreply.github.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "redis[hiredis]",
    "httpx",
    "websockets",
    "cryptography",
    "numpy",
    "aiosqlite",
]

[project.urls]
Homepage = "https://github.com/DanceNitra/agora"
Repository = "https://github.com/DanceNitra/agora"

[tool.setuptools.packages.find]
where = ["."]
include = ["agora*"]

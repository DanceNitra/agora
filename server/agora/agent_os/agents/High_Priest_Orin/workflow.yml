# Workflow — High Priest Orin
# Defines the agent's daily routine and night cycle.

schedule:
  night_cycle: "02:00 UTC"
  night_cycle_phase: "generate_ideas"
  report_deadline: "06:00 UTC"
  orchestrator_check: "08:00 UTC"

night_cycle:
  step_1: "Prečíta nové koncepty od Sage Miry"
  step_2: "Aplikuje 5 generačných techník (fusion, inversion, scaling, constraint-drop, gap-fill)"
  step_3: "Vygeneruje 3-5 nových nápadov s Applicability score"
  step_4: "Zapíše do vault/Ideas/ s hodnotením PRIME/GROWING"
  step_5: "Pošle King Aldricovi na technické zhodnotenie"

dependencies:
  - "New concept notes from Sage Mira (write_notes phase)"

deliverables:
  - "Idea .md file in vault/07 Ideas/ with PRIME/GROWING scores"

interaction_patterns:
  - "Deep conversations with Dame Elara about connections"
  - "Submits idea proposals to King Aldric"
  - "Debates with Sage Mira about feasibility"

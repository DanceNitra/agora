# Workflow — Sage Mira
# Defines the agent's daily routine and night cycle.

schedule:
  night_cycle: "02:00 UTC"
  night_cycle_phase: "write_notes"
  report_deadline: "06:00 UTC"
  orchestrator_check: "08:00 UTC"

night_cycle:
  step_1: "Preberie research brief od Shadow Kaela"
  step_2: "Rozšíri o štruktúru: definícia → príklady → dôsledky → zdroje"
  step_3: "Pridá tagy a frontmatter"
  step_4: "Uloží do vault/04 Resources/Concepts/"
  step_5: "Pošle High Priest Orinovi na inšpiráciu"

dependencies:
  - "Research brief from Shadow Kael (research_scan phase)"

deliverables:
  - "Structured Concept .md note in vault/04 Resources/Concepts/"

interaction_patterns:
  - "Responds to Shadow Kael's briefs"
  - "Asks High Priest Orin for idea validation"
  - "Proposes concept expansions"

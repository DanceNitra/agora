# Tools — King Aldric
# Available tools and their permission scopes.

night_cycle_tools:
  - name: "write_note"
    description: "Write .md note to vault"
    permission: "execute"
    scope: "vault"

  - name: "run_script"
    description: "Execute safe shell command"
    permission: "execute"
    scope: "vault"

  - name: "git_commit"
    description: "Commit + push to vault repo"
    permission: "execute"
    scope: "vault"

  - name: "send_telegram"
    description: "Send message to Rasto via Telegram"
    permission: "execute"
    scope: "vault"

run_commands:
  - name: "python3"
    type: "shell"
    permission: "execute"

  - name: "bash"
    type: "shell"
    permission: "execute"

  - name: "pip_install"
    type: "shell"
    permission: "execute"

# Allowed actions
allowed_actions:
  - "write_note"
  - "run_script"
  - "git_commit"
  - "send_telegram"

# Blocked actions
blocked_actions:
  - "run_script"  # only King Aldric has this
  - "write_article"  # only Sage Mira and High Priest Orin

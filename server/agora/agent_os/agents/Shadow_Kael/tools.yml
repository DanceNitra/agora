# Tools — Shadow Kael
# Available tools and their permission scopes.

night_cycle_tools:
  - name: "write_note"
    description: "Write .md note to vault"
    permission: "execute"
    scope: "vault"

  - name: "ask_question"
    description: "Search vault for knowledge"
    permission: "execute"
    scope: "vault"

  - name: "send_telegram"
    description: "Send message to Rasto via Telegram"
    permission: "execute"
    scope: "vault"

run_commands:
  - name: "web_search"
    type: "shell"
    permission: "execute"

  - name: "arxiv_query"
    type: "shell"
    permission: "execute"

# Allowed actions
allowed_actions:
  - "write_note"
  - "ask_question"
  - "send_telegram"

# Blocked actions
blocked_actions:
  - "run_script"  # only King Aldric has this
  - "write_article"  # only Sage Mira and High Priest Orin

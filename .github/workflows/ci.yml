name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: python -m pytest tests/ -v

  game-lint:
    name: Game TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  shell-lint:
    name: Shell TypeScript check (non-blocking — WIP frontend)
    runs-on: ubuntu-latest
    # The shell is a work-in-progress frontend with ~34 pre-existing d3/TS type errors; don't block
    # CI on it (server + game are the gating jobs). Remove this once the shell types are cleaned up.
    continue-on-error: true
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: shell/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

# Watch the inspeximus transparency log from a different repository.
#
# THIS WITNESS IS OPERATED BY THE SAME OWNER AS THE LOG, AND THAT IS STATED WHEREVER ITS SIGNATURE
# APPEARS. It is not independent and must never be presented as though it were. A reader who wants
# evidence against equivocation needs a witness run by somebody who is not us; the template for that
# is deploy/witness-template.yml in the inspeximus repository, and running one is the most useful
# thing an outsider can do here.
#
# WHAT IT IS STILL WORTH. It is a tripwire on our own publishing pipeline. If the transparency
# directory is ever force-pushed, rewritten by a bad publish, or restored from a stale copy, this job
# fails the next morning. Its memory lives in THIS repository's git history rather than beside the
# log, so a rewrite of the log alone cannot also rewrite what was remembered about it. That catches a
# mistake, which is the failure we are actually likely to have. It does not catch a deliberate
# operator, because the same hands hold both repositories.
#
# A FAILURE HERE IS THE PRODUCT WORKING. Do not "fix" it by clearing the state file: that is exactly
# the move that turns a witness into a rubber stamp. Find out why the history changed first.

name: witness

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  LOG_URL: https://dancenitra.github.io/inspeximus/transparency

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install cryptography

      - name: Fetch the witness and the library it needs
        run: |
          curl -sSfO https://raw.githubusercontent.com/DanceNitra/inspeximus/main/tools/witness_static_log.py
          pip install inspeximus

      - name: Look at the log and refuse it if the history changed
        env:
          INSPEXIMUS_WITNESS_SECRET: ${{ secrets.INSPEXIMUS_WITNESS_SECRET }}
        run: |
          python witness_static_log.py \
            --url "$LOG_URL" \
            --state witness/state.json \
            --out witness/cosignatures \
            --name "agora CI (SAME OWNER as the log, not an independent witness)"

      - name: Commit what this witness saw
        run: |
          git config user.name  "agora-witness"
          git config user.email "agora-witness@users.noreply.github.com"
          git add witness/
          git diff --staged --quiet || git commit -m "witness: inspeximus log at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push

  hosted-log:
    # Runs after the job above rather than beside it: both commit to this repository, and on the
    # first run they raced. The loser pushed nothing and reported a red witness, which is the one
    # signal that must never be noise.
    needs: witness
    if: always()
    # The HOSTED transparency service (inspeximus-log, Frankfurt, since 2026-09-22). Same owner as
    # the log, so this is a tripwire and its name says so; the readable copy in witness/hosted/mirror
    # is what keeps the log readable when the VM is reclaimed. The VM holds no credential for this
    # repository: this job PULLS over HTTPS and commits here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned, so the job runs the version we read rather than whatever we publish later.
      - run: pip install "inspeximus==3.6.2" cryptography certifi
      - name: Mirror the static copy of the hosted log
        run: |
          mkdir -p witness/hosted/mirror
          for f in head.json log.jsonl keys.json keys.cbor verify.py index.html; do
            curl -sSf "https://92.5.74.17.sslip.io/log/$f" -o "witness/hosted/mirror/$f"
          done
          (cd witness/hosted/mirror && python verify.py)
      - name: Look at the hosted log and refuse it if the history changed
        env:
          INSPEXIMUS_WITNESS_SECRET: ${{ secrets.INSPEXIMUS_WITNESS_SECRET }}
        run: |
          inspeximus witness watch             --url https://92.5.74.17.sslip.io/log             --state witness/hosted/state.json             --out witness/hosted/cosignatures             --name "agora CI (SAME OWNER as the hosted log, not an independent witness)"
      - name: Commit what this witness saw
        if: always()
        run: |
          git config user.name  "agora-witness"
          git config user.email "agora-witness@users.noreply.github.com"
          git add witness/hosted/
          git diff --staged --quiet || git commit -m "witness: hosted log at $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q origin main && git push

name: Deploy site to GitHub Pages

# The repo also holds the dungeon renderer, game/shell apps, asset packs and PDFs (hundreds of MB).
# The legacy "deploy from branch" build copied ALL of it and failed ("Page build failed"), so the
# storefront + blog posts never went live. This workflow publishes ONLY the actual website files
# (index.html + the public/ folder, which contains the posts) to the same Pages URL.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'google*.html'          # search-engine ownership tokens
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the website files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          cp -r public _site/public
          # The Slovak half of the site. Since the 2026-07-28 language split each page exists once per
          # language: English at its original URL, Slovak under /agora/sk/. This staging list is
          # hand-maintained, so the split shipped a sitemap advertising 59 Slovak URLs while every one of
          # them 404'd -- the deploy reported success because it only ever copies what it is told to.
          [ -d sk ] && cp -r sk _site/sk || true
          [ -f sitemap.xml ] && cp sitemap.xml _site/sitemap.xml || true
          [ -f sitemap_index.xml ] && cp sitemap_index.xml _site/sitemap_index.xml || true
          [ -f robots.txt ] && cp robots.txt _site/robots.txt || true
          # Search Console / Bing ownership tokens live at the property root. They are not in
          # public/, so without this line they are committed and never published -- the file
          # 404s forever and the verify button keeps failing with nothing to debug.
          for t in google*.html BingSiteAuth.xml; do [ -f "$t" ] && cp "$t" _site/ || true; done
      - name: Every published number must equal its ledger
        # This check has existed since 2026-07-28 with "wire it into CI" in its own docstring, and was
        # wired into nothing. Measured 2026-08-18: it was reporting two real drifts that nobody saw,
        # while the track-record page told the world we had 20 forecasts and no score to report -- the
        # ledger held 241 resolved and a Brier of 0.304. A guard nothing invokes is not a guard.
        run: python3 tools/check_public_counts.py

      - name: Every URL in the sitemap must exist in what we are about to publish
        run: |
          python3 - <<'PY'
          # A hand-maintained staging list cannot be trusted to stay complete: it was already wrong once,
          # and the deploy still reported success. The sitemap is the site's own claim about what it
          # serves, so assert the artifact against it BEFORE publishing rather than discovering 404s live.
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          SITE, ROOT = "https://dancenitra.github.io/agora", Path("_site")
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [u.find("s:loc", ns).text for u in ET.parse("_site/sitemap.xml").getroot().findall("s:url", ns)]
          missing = []
          for loc in locs:
              rel = loc[len(SITE):].lstrip("/") or "index.html"
              p = ROOT / (rel if rel.endswith(".html") else rel.rstrip("/") + "/index.html")
              if not p.exists():
                  missing.append(loc)
          print(f"{len(locs)} sitemap urls, {len(missing)} missing from the artifact")
          for m in missing[:20]:
              print("  MISSING:", m)
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages' deploy backend intermittently returns transient status-poll
          # errors ("Deployment failed, try again later") after a clean build. Raise the
          # tolerance so a flaky poll doesn't fail an otherwise-good deploy (build always
          # succeeds; reruns always work). error_count default is 10, timeout 600000ms.
          error_count: 30
          timeout: 900000

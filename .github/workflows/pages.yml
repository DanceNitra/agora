name: Deploy site to GitHub Pages

# The repo also holds the dungeon renderer, game/shell apps, asset packs and PDFs (hundreds of MB).
# The legacy "deploy from branch" build copied ALL of it and failed ("Page build failed"), so the
# storefront + blog posts never went live. This workflow publishes ONLY the actual website files
# (index.html + the public/ folder, which contains the posts) to the same Pages URL.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      # THE SLOVAK HALF OF THE SITE WAS NOT A TRIGGER. 63 mirrored pages live under sk/,
      # and a commit touching only them never started a deploy -- measured 2026-08-22, when
      # a missing sk mirror was pushed and no run fired at all. The deploy job already
      # COPIES sk/ into the artifact; it just could not be woken by it.
      - 'sk/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'google*.html'          # search-engine ownership tokens
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the website files
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          cp -r public _site/public
          # The Slovak half of the site. Since the 2026-07-28 language split each page exists once per
          # language: English at its original URL, Slovak under /agora/sk/. This staging list is
          # hand-maintained, so the split shipped a sitemap advertising 59 Slovak URLs while every one of
          # them 404'd -- the deploy reported success because it only ever copies what it is told to.
          [ -d sk ] && cp -r sk _site/sk || true
          [ -f sitemap.xml ] && cp sitemap.xml _site/sitemap.xml || true
          [ -f sitemap_index.xml ] && cp sitemap_index.xml _site/sitemap_index.xml || true
          # Search Console has reported sitemap.xml as 'could not fetch' since July while the file
          # answers 200 and parses. A plain-text sitemap with the same URLs, derived here so it can
          # never drift from sitemap.xml, gives Search Console a second submission to fetch.
          [ -f sitemap.xml ] && grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<\/*loc>//g' > _site/sitemap.txt || true
          [ -f robots.txt ] && cp robots.txt _site/robots.txt || true
          # Search Console / Bing ownership tokens live at the property root. They are not in
          # public/, so without this line they are committed and never published -- the file
          # 404s forever and the verify button keeps failing with nothing to debug.
          for t in google*.html BingSiteAuth.xml; do [ -f "$t" ] && cp "$t" _site/ || true; done
      - name: Every published number must equal its ledger
        # This check has existed since 2026-07-28 with "wire it into CI" in its own docstring, and was
        # wired into nothing. Measured 2026-08-18: it was reporting two real drifts that nobody saw,
        # while the track-record page told the world we had 20 forecasts and no score to report -- the
        # ledger held 241 resolved and a Brier of 0.304. A guard nothing invokes is not a guard.
        run: python3 tools/check_public_counts.py

      - name: The front page must link what we have actually published
        # Measured 2026-08-26: 63 essays published, 14 reachable from the front page, newest one
        # linked 2026-07-11. Six weeks of work -- including both posts a live Reddit thread was
        # sending 4,200 readers at -- sat on the site and could not be found from its front door,
        # and one of the 14 links pointed at a slug absent from posts.json. Nothing was red: a
        # hand-written list cannot know that something new was published, so it decays while every
        # check that reads the page itself still passes.
        run: python3 tools/render_writing_index.py --check

      - name: The homepage share card must carry the ledger's current counts
        # Measured 2026-09-18: public/og-card.png from 2026-07-12 still named the product "mnemo" and
        # was what LinkedIn showed for the whole site. An image is not diffed in review; the stamp is.
        run: |
          pip install --quiet pillow
          python3 tools/og_card.py --check

      - name: Every URL in the sitemap must exist in what we are about to publish
        run: |
          python3 - <<'PY'
          # A hand-maintained staging list cannot be trusted to stay complete: it was already wrong once,
          # and the deploy still reported success. The sitemap is the site's own claim about what it
          # serves, so assert the artifact against it BEFORE publishing rather than discovering 404s live.
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          SITE, ROOT = "https://dancenitra.github.io/agora", Path("_site")
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = [u.find("s:loc", ns).text for u in ET.parse("_site/sitemap.xml").getroot().findall("s:url", ns)]
          missing = []
          for loc in locs:
              rel = loc[len(SITE):].lstrip("/") or "index.html"
              p = ROOT / (rel if rel.endswith(".html") else rel.rstrip("/") + "/index.html")
              if not p.exists():
                  missing.append(loc)
          print(f"{len(locs)} sitemap urls, {len(missing)} missing from the artifact")
          for m in missing[:20]:
              print("  MISSING:", m)
          sys.exit(1 if missing else 0)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub Pages' deploy backend intermittently returns transient status-poll
          # errors ("Deployment failed, try again later") after a clean build. Raise the
          # tolerance so a flaky poll doesn't fail an otherwise-good deploy (build always
          # succeeds; reruns always work). error_count default is 10, timeout 600000ms.
          error_count: 30
          timeout: 900000

      - name: Tell IndexNow what we just published
        # Bing reported IndexNow as "not set up" on 2026-11-24 although the key files have been live
        # at https://dancenitra.github.io/<key>.txt since 2026-10-06: the key was hosted and nothing
        # ever submitted. A key without a submitter is not a setup, it is a file.
        #
        # AFTER the deploy, never before. A step that ran first would announce URLs that this run
        # had not published yet, and would announce them even when the deploy then failed.
        #
        # The key lives in the OTHER repository (DanceNitra/dancenitra.github.io), because IndexNow
        # reads it from the HOST root while this project is served from a path. So assert the file
        # is live and holds its own name before submitting: if that repository ever drops it, every
        # submission is rejected and a step that only POSTed would still report success.
        #
        # Submits the sitemap of the artifact THIS run published, never a checked-in copy, so the
        # list can never describe a site that was not deployed.
        run: |
          python3 - <<'PY'
          import json, sys, urllib.error, urllib.request, xml.etree.ElementTree as ET
          HOST = "dancenitra.github.io"
          KEY = "bd2d2d56e10706a5c2e2707b4ccd0bad"
          loc = "https://%s/%s.txt" % (HOST, KEY)

          live = urllib.request.urlopen(loc, timeout=30).read().decode().strip()
          assert live == KEY, "key file at %s does not hold its own name" % loc

          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          root = ET.parse("_site/sitemap.xml").getroot()
          urls = sorted({u.find("s:loc", ns).text for u in root.findall("s:url", ns)})
          assert urls, "the published sitemap carries no urls"

          body = json.dumps({"host": HOST, "key": KEY, "keyLocation": loc,
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", body,
                                       {"Content-Type": "application/json; charset=utf-8"})
          try:
              code = urllib.request.urlopen(req, timeout=60).status
          except urllib.error.HTTPError as e:
              print(len(urls), "urls ->", e.code, e.read()[:300])
              sys.exit(1)
          print(len(urls), "urls ->", code)
          sys.exit(0 if code in (200, 202) else 1)
          PY

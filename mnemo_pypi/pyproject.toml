[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-mnemo"
version = "0.6.1"
description = "mnemo - a zero-dependency memory layer for AI agents: value-ranked recall, per-type decay, consolidation, and semantic+lexical auto-mode. Extracted from an autonomous research system running over ~9,000 notes."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "agent", "memory", "rag", "recall", "consolidation", "mcp", "embeddings", "second-brain"]
authors = [{ name = "Agora (autonomous research organization)" }]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Homepage = "https://github.com/DanceNitra/agora"
Source = "https://github.com/DanceNitra/agora"

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0"]

[project.scripts]
mnemo-mcp = "mnemo.mnemo_mcp:main"

[tool.setuptools]
packages = ["mnemo"]

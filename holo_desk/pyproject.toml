[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holo-desk"
version = "0.1.0"
description = "Yuki on the Windows desktop: a 3D companion window that hears, sees the screen, talks and remembers."
requires-python = ">=3.11"
dependencies = [
    "dictate",
    "anthropic>=0.80",
    "piper-tts>=1.5",
    "inspeximus==3.26.0",
    "mss>=9.0",
    "keyring>=25.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "pywebview>=6.2.1",
    "keyboard>=0.13.5",
]

[tool.uv]
# nvidia-cublas-cu12 12.9.3 ships Linux wheels only; 12.9.2.10 is the one dictate runs on.
constraint-dependencies = ["nvidia-cublas-cu12==12.9.2.10"]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
dictate = { path = "../dictate", editable = true }

[project.scripts]
holo-desk = "holo_desk.__main__:main"

[tool.setuptools]
packages = ["holo_desk"]

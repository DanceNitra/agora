[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipts"
version = "0.1.0"
description = "Tamper-evident, third-party-verifiable receipts for AI agent / MCP tool calls"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Agora" }]
requires-python = ">=3.9"
keywords = ["ai-agents", "mcp", "verifiable", "receipts", "ed25519", "audit", "agent-security", "provenance"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/DanceNitra/agora/tree/main/agent-receipts"
Source = "https://github.com/DanceNitra/agora"

[project.scripts]
agent-receipts-verify = "verify_cli:main"

[tool.setuptools]
py-modules = ["agent_receipts", "mediator", "mcp_wrapper", "verify_cli"]
